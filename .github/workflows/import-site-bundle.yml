name: Import site bundle and publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/import-site-bundle.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate site files and import the bundle only when needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil

          archive = Path("Anisha_GitHub_Pages_Package.zip")
          target = Path("site")
          set_a = [
              "1000273785.jpg", "1000273788.jpg", "1000269536.jpg",
              "1000269530.jpg", "1000269512.jpg", "1000269616.png",
              "1000269497.jpg", "1000268857.jpg",
          ]
          set_b = [
              "1000274618.jpg", "1000274619.jpg", "1000274620.jpg",
              "1000274621.jpg", "1000274622.jpg", "1000274623.jpg",
              "1000274624.jpg", "1000274625.jpg", "1000274465.jpg",
              "1000274466.jpg", "1000274467.jpg", "1000274468.jpg",
          ]
          art = [
              "blue-butterfly.jpg", "butterfly-girl-mood.jpg",
              "floating-mountains.jpg", "garden-variant.jpg", "gate.jpg",
              "sky-palace.jpg", "sunlit-garden.jpg",
          ]
          required = {"index.html", "content.js", ".nojekyll"}
          required.update(f"assets/set-a/{name}" for name in set_a)
          required.update(f"assets/set-b/{name}" for name in set_b)
          required.update(f"assets/art/{name}" for name in art)

          site_is_complete = target.is_dir() and all(
              (target / name).is_file() for name in required
          )
          if site_is_complete:
              print("Using the checked-in site/ files; existing code edits will be preserved.")
          else:
              if not archive.is_file():
                  raise SystemExit(
                      "The site/ files are incomplete and Anisha_GitHub_Pages_Package.zip is missing."
                  )
              with ZipFile(archive) as bundle:
                  names = set(bundle.namelist())
                  missing = sorted(required - names)
                  if missing:
                      raise SystemExit(
                          "The package is missing required site/gallery files: "
                          + ", ".join(missing)
                      )
                  if target.exists():
                      shutil.rmtree(target)
                  target.mkdir(parents=True, exist_ok=True)
                  for item in bundle.infolist():
                      if item.is_dir():
                          continue
                      rel = PurePosixPath(item.filename)
                      if rel.is_absolute() or ".." in rel.parts:
                          raise SystemExit("Unsafe ZIP path rejected: " + item.filename)
                      destination = target.joinpath(*rel.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(bundle.read(item))
              print("Imported the verified package to initialise site/.")

          missing_after = [name for name in required if not (target / name).is_file()]
          if missing_after:
              raise SystemExit("Required site files missing: " + ", ".join(sorted(missing_after)))
          print("Verified the HTML, JavaScript, art, 8 Set A originals and 12 Set B screenshots.")
          PY

      - name: Generate optimized WebP images for quicker loading
        shell: bash
        run: |
          python -c "from PIL import Image" 2>/dev/null || python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          assets = Path("site/assets")
          created = source_bytes = webp_bytes = 0
          for source in sorted(assets.rglob("*")):
              if not source.is_file() or source.suffix.lower() not in {".jpg", ".jpeg", ".png"}:
                  continue
              target = source.with_suffix(".webp")
              if not target.exists():
                  with Image.open(source) as opened:
                      image = ImageOps.exif_transpose(opened)
                      if image.mode not in {"RGB", "RGBA"}:
                          image = image.convert("RGB")
                      quality = 90 if "set-b" in source.parts else (86 if "set-a" in source.parts else 83)
                      image.save(target, "WEBP", quality=quality, method=5)
                  created += 1
              source_bytes += source.stat().st_size
              webp_bytes += target.stat().st_size
          print(f"Created {created} WebP images; source bytes {source_bytes:,}; WebP bytes {webp_bytes:,}.")
          js_path = Path("site/content.js")
          js = js_path.read_text(encoding="utf-8")
          pattern = re.compile(r'src: "(assets/set-[ab]/[^"]+)\.(jpg|jpeg|png)", alt:')
          def upgrade(match):
              stem, ext = match.group(1), match.group(2)
              return f'src: "{stem}.webp", fallback: "{stem}.{ext}", alt:'
          js, changed = pattern.subn(upgrade, js)
          if changed:
              js_path.write_text(js, encoding="utf-8")
              print(f"Updated {changed} new gallery paths with original fallbacks.")
          PY

      - name: Commit website source and media to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "Add complete birthday website and original gallery media"
            git push
          else
            echo "Site files are already up to date."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
