name: Import site bundle and publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract the complete static site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil

          archive = Path("Anisha_GitHub_Pages_Package.zip")
          if not archive.is_file():
              raise SystemExit(
                  "Upload Anisha_GitHub_Pages_Package.zip to the repository root first."
              )

          set_a = [
              "1000273785.jpg", "1000273788.jpg", "1000269536.jpg",
              "1000269530.jpg", "1000269512.jpg", "1000269616.png",
              "1000269497.jpg", "1000268857.jpg",
          ]
          set_b = [
              "1000274618.jpg", "1000274619.jpg", "1000274620.jpg",
              "1000274621.jpg", "1000274622.jpg", "1000274623.jpg",
              "1000274624.jpg", "1000274625.jpg", "1000274465.jpg",
              "1000274466.jpg", "1000274467.jpg", "1000274468.jpg",
          ]

          with ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              required = {"index.html", "content.js", ".nojekyll"}
              required.update(f"assets/set-a/{name}" for name in set_a)
              required.update(f"assets/set-b/{name}" for name in set_b)
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(
                      "The package is missing required site/gallery files: "
                      + ", ".join(missing)
                  )

              target = Path("site")
              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True)

              for item in bundle.infolist():
                  if item.is_dir():
                      continue
                  rel = PurePosixPath(item.filename)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit("Unsafe ZIP path rejected: " + item.filename)
                  # The validated archive is the whole deployable site.
                  destination = target.joinpath(*rel.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(bundle.read(item))

          # Verify the extracted files before committing or publishing.
          missing_after = [str(Path("site") / f"assets/set-a/{name}") for name in set_a
                           if not (Path("site") / f"assets/set-a/{name}").is_file()]
          missing_after += [str(Path("site") / f"assets/set-b/{name}") for name in set_b
                            if not (Path("site") / f"assets/set-b/{name}").is_file()]
          if missing_after:
              raise SystemExit("Extracted gallery files missing: " + ", ".join(missing_after))
          print("Verified index.html, content.js, 8 Set A originals and 12 Set B screenshots.")
          PY

      - name: Commit website source and media to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "Add complete birthday website and original gallery media"
            git push
          else
            echo "Site files are already up to date."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
